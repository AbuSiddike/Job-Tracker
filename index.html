<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/jobs.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="./tailwind_styles/output.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .geist {
        font-family: 'Geist', sans-serif;
      }
    </style>
  </head>
  <body class="geist">
    <!-- ======= DASHBOARD ======= -->
    <section class="max-w-7xl mx-auto pt-10 pb-10 mb-10">
      <h1 class="text-3xl font-bold mb-6">Job Application Tracker</h1>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="card bg-base-100 shadow-xl">
          <div class="card-body text-center">
            <h2 class="card-title justify-center">Total Jobs</h2>
            <p id="total-count" class="text-3xl font-bold">0</p>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl">
          <div class="card-body text-center">
            <h2 class="card-title justify-center">Interview</h2>
            <p id="interview-count" class="text-3xl font-bold text-success">
              0
            </p>
          </div>
        </div>

        <div class="card bg-base-100 shadow-xl">
          <div class="card-body text-center">
            <h2 class="card-title justify-center">Rejected</h2>
            <p id="rejected-count" class="text-3xl font-bold text-error">0</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ======= JOBS SECTION ======= -->
    <section class="max-w-7xl mx-auto pb-10">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-semibold">Available Jobs</h2>
        <span id="job-count" class="badge badge-primary badge-lg">0 Jobs</span>
      </div>

      <!-- Tabs -->
      <div class="tabs tabs-boxed mb-6">
        <button class="tab tab-active" data-tab="all">All</button>
        <button class="tab" data-tab="interview">Interview</button>
        <button class="tab" data-tab="rejected">Rejected</button>
      </div>

      <!-- Jobs Container -->
      <div
        id="jobs-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </section>
    <script src="./script/jobsData.js"></script>
    <script src="./script/script.js"></script>
  </body>
</html>
